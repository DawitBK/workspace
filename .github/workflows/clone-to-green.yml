name: clone-to-green

# Proves a fresh machine gets working code from git alone: unit tests, then `workspace pull` of the showcase scope
# into an empty folder, then install and build of every cloned repo, on three operating systems.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  clone-to-green:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # the runner context is not available in a job-level env, so the empty target folder is exported from a step
      - name: empty target folder for the clones
        shell: bash
        run: echo "WORKSPACE_DEV_ROOT=${{ runner.temp }}/dev" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - run: node src/cli.mjs pull --scope=showcase
      - run: node src/cli.mjs status --scope=showcase
      - run: node scripts/verify-clones.mjs --scope=showcase
